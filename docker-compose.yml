version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: govt-services-db
    environment:
      POSTGRES_DB: govt_services
      POSTGRES_USER: ${DB_USER:-govt_services_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govt_services_user -d govt_services"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - govt-services-network

  redis:
    image: redis:7-alpine
    container_name: govt-services-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - govt-services-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govt-services-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-govt_services_user}:${DB_PASSWORD:-secure_password_here}@postgres:5432/govt_services
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_key_here}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    volumes:
      - ./backend:/app
      - document_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - govt-services-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govt-services-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    networks:
      - govt-services-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  document_storage:
    driver: local

networks:
  govt-services-network:
    driver: bridge
